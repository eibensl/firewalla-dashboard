<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Firewalla Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/static/next/favicon.svg?v=2">
    <link rel="stylesheet" href="/static/next/style.css?v=511">
    <!-- The theme this browser last used (Sci-Fi when none yet), until the NAS answers (engine.js applyTheme) -->
    <script>try { const t = localStorage.getItem("firewallaTheme") || "scifi"; if (t === "light" || t === "scifi") document.documentElement.dataset.theme = t; } catch (_) { document.documentElement.dataset.theme = "scifi"; }</script>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <img class="brand-icon" src="/static/next/favicon.svg?v=2" alt="">
            <div class="brand-text"><strong>My Network</strong><span>Firewalla Dashboard</span></div>
        </div>
        <nav id="nav"></nav>
        <img class="sidebar-mark" src="/static/next/favicon.svg?v=2" alt="">
        <nav id="navFoot" aria-label="Settings"></nav>
        <button id="ipMask" class="nav-item nav-mask" type="button" role="switch"></button>
        <button id="easyMode" class="nav-item nav-mask" type="button" role="switch"></button>
        <button id="navCollapse" class="nav-item nav-collapse" type="button"></button>
        <div id="sidebarHandle" class="sidebar-handle" title="Drag to resize the menu · double-click for the standard width"></div>
    </aside>

    <main class="main">
        <header class="topbar">
            <svg class="topbar-net" viewBox="0 0 340 62" preserveAspectRatio="none" aria-hidden="true">
                <defs><linearGradient id="net-fire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset=".45" stop-color="#f97316"/><stop offset="1" stop-color="#db2777"/></linearGradient></defs>
                <path d="M10 40 L70 18 L130 44 L190 14 L250 38 L320 20 M70 18 L110 6 M190 14 L230 52 M130 44 L160 58" stroke="url(#net-fire)" stroke-width="1" opacity=".8" fill="none"/>
                <g fill="#f97316"><circle cx="10" cy="40" r="2.5"/><circle cx="70" cy="18" r="3"/><circle cx="130" cy="44" r="2.5"/><circle cx="190" cy="14" r="3"/><circle cx="250" cy="38" r="2.5"/><circle cx="320" cy="20" r="3" fill="#db2777"/><circle cx="110" cy="6" r="2" fill="#fde047"/><circle cx="230" cy="52" r="2" fill="#db2777"/><circle cx="160" cy="58" r="2" fill="#fde047"/></g>
            </svg>
            <button id="menuBtn" class="btn menu-btn" type="button" aria-label="Menu" aria-expanded="false">☰</button>
            <div>
                <h1 id="pageTitle">Overview</h1>
                <div id="pageSubtitle" class="subtitle"></div>
            </div>
            <div class="top-actions">
                <span id="liveStatus" class="live-status"></span>
                <a id="askLeft" class="ask-left" href="#questions" hidden></a>
            </div>
        </header>

        <div id="filterBar" class="filter-bar" hidden></div>

        <div id="updateBar" class="update-bar" hidden>
            <strong>A newer version of the dashboard is ready.</strong> Refresh to use it.
            <button id="updateRefresh" class="btn small primary">Refresh</button>
        </div>

        <div id="message" class="message" hidden></div>

        <div id="canvasScroller" class="canvas-scroller">
            <div id="canvas" class="canvas"></div>
        </div>
    </main>

    <dialog id="infoDialog" class="equip-dialog info-dialog">
        <h3 id="infoTitle"></h3>
        <div id="infoBody"></div>
        <div class="dialog-actions"><button class="btn primary" onclick="this.closest('dialog').close()">Close</button></div>
    </dialog>

    <!-- Hover details box (filled by the engine) -->
    <div id="tip" class="tip" role="tooltip" hidden></div>

    <!-- Shared paint for the network device pictures (white bodies, silver ports, AP7C top) -->
    <svg class="svg-defs" aria-hidden="true" width="0" height="0" focusable="false">
        <defs>
            <linearGradient id="fw-shell" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fdfdfd"/><stop offset=".5" stop-color="#eff0f2"/><stop offset="1" stop-color="#d9dce1"/>
            </linearGradient>
            <linearGradient id="fw-jack" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#020203"/><stop offset="1" stop-color="#16171b"/>
            </linearGradient>
            <linearGradient id="fw-cage" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#a3a8b1"/><stop offset=".5" stop-color="#6c717a"/><stop offset="1" stop-color="#4a4e56"/>
            </linearGradient>
            <radialGradient id="fw-disc" cx=".38" cy=".32" r=".8">
                <stop offset="0" stop-color="#fbfbfc"/><stop offset=".55" stop-color="#e3e5e9"/><stop offset="1" stop-color="#b9bdc4"/>
            </radialGradient>
            <filter id="fw-glow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="2.5"/>
            </filter>
            <filter id="fw-shadow" x="-20%" y="-20%" width="140%" height="150%">
                <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".55"/>
            </filter>
        </defs>
    </svg>

    <script src="/static/next/cards.js?v=324"></script>
    <script src="/static/next/views.js?v=701"></script>
    <script src="/static/next/engine.js?v=344"></script>
</body>
</html>
